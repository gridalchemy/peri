  <div class="bar"><span class="lab">Shell</span>

  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
await (document.fonts ? Promise.all([document.fonts.load("8px 'Press Start 2P'"), document.fonts.load("13px Outfit")]).catch(() => {}) : null);

// ================= options (toggles) =================
const OPTS_KEY = 'peri-3d-opts';
const opts = Object.assign({ mat: 'opaque', view: 'three', tone: 'neutral' }, (() => { try { return JSON.parse(localStorage.getItem(OPTS_KEY)) || {}; } catch (e) { return {}; } })());
const saveOpts = () => { try { localStorage.setItem(OPTS_KEY, JSON.stringify(opts)); } catch (e) {} };
const syncBar = () => document.querySelectorAll('.bar button').forEach(b => b.setAttribute('aria-pressed', String(opts[b.dataset.k] === b.dataset.v)));

// ================= palette (her shipped colors) =================
const P = {
  shell: '#8497F3', outline: '#32428D', bezel: '#1E2649', bezelDeep: '#0C1126', ink: '#1B2345',
  look: '#4E63C7', lookInk: '#E2E7FF', pet: '#BF5E95', petInk: '#FFF3F9',
  off: '#D85025', offInk: '#FFF1EF', on: '#59AFB1', onInk: '#0B1A1A',
  plate: '#B4BBD6', plateInk: '#35406F', plateEdge: '#435091', ring: '#AB5284', knob: '#4E63C7', knobEdge: '#2C3A7F',
  groove: '#171D3A',
};

// ================= the shell's outline, in her own 358 x 452 units =================
// 3D frame: x right, y up, z out of her face toward you. 1 unit = 1 CSS px of the shipped shell.
const SX = (x) => x - 179, SY = (y) => 226 - y;
const NT = 1024;                 // points around the outline
const JR = 48, JF = 320, JFB = 320; // rings: rim, front face, back face
const RIM = 18;                  // how far the rounded edge reaches into the face
const FRONT = { Hr: 34, D: 5 }, BACK = { Hr: 40, D: 14 }; // rim height and dome, each half
const CX = 0, CY = -32;          // the egg's centre (svg 179, 258), where the two ellipses meet
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// border-radius 50% 50% 47% 47% / 57% 57% 43% 43% on 358 x 452: two half-ellipses, as in shellPath()
const dense = [];
for (let k = 0; k < 16384; k++) {
  const t = (k / 16384) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
  let x, y;
  if (s >= 0) { x = 179 + 179 * c; y = 258 - 258 * s; }
  else { x = 179 + 10.74 * Math.max(-1, Math.min(1, c * 25)) + 168.26 * c; y = 257.64 - 194.36 * s; }
  dense.push([SX(x), SY(y)]);
}
const cum = [0];
for (let k = 1; k <= dense.length; k++) { const a = dense[k - 1], b = dense[k % dense.length]; cum.push(cum[k - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
const PER = cum[dense.length];
const O = [], SARC = [];
for (let i = 0, k = 0; i < NT; i++) {
  const target = (i / NT) * PER;
  while (cum[k + 1] < target) k++;
  const f = (target - cum[k]) / (cum[k + 1] - cum[k] || 1), a = dense[k], b = dense[(k + 1) % dense.length];
  O.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); SARC.push(target);
}
// outward normals, lightly smoothed over the two tiny steps where the ellipses meet
const N = O.map((p, i) => {
  let nx = 0, ny = 0;
  for (let k = -4; k <= 4; k++) { const a = O[(i + k - 1 + NT) % NT], b = O[(i + k + 1 + NT) % NT]; const tx = b[0] - a[0], ty = b[1] - a[1], l = Math.hypot(tx, ty); nx += ty / l; ny += -tx / l; }
  const l = Math.hypot(nx, ny); return [nx / l, ny / l];
});
const OR = O.map((p, i) => [p[0] - RIM * N[i][0], p[1] - RIM * N[i][1]]);

// distance from the centre to the inner edge of the rim, by direction
const RHO_BINS = 4096, rho = new Float32Array(RHO_BINS);
{
  const pts = OR.map(([x, y]) => [Math.atan2(y - CY, x - CX), Math.hypot(x - CX, y - CY)]);
  for (let i = 0; i < NT; i++) {
    const [a0, r0] = pts[i], [a1, r1] = pts[(i + 1) % NT];
    let da = a1 - a0; if (da < -Math.PI) da += 2 * Math.PI;
    const b0 = (a0 + Math.PI) / (2 * Math.PI) * RHO_BINS, b1 = b0 + da / (2 * Math.PI) * RHO_BINS;
    for (let b = Math.floor(b0); b <= Math.ceil(b1); b++) rho[((b % RHO_BINS) + RHO_BINS) % RHO_BINS] = r0 + (r1 - r0) * Math.min(1, Math.max(0, (b - b0) / ((b1 - b0) || 1)));
  }
}
const rhoAt = (x, y) => {
  const b = (Math.atan2(y - CY, x - CX) + Math.PI) / (2 * Math.PI) * RHO_BINS, i0 = Math.floor(b), f = b - i0;
  return rho[((i0 % RHO_BINS) + RHO_BINS) % RHO_BINS] * (1 - f) + rho[(((i0 + 1) % RHO_BINS) + RHO_BINS) % RHO_BINS] * f;
};
// the uncarved surface height of one half at (x, y)
function surfH(x, y, half) {
  const r = Math.hypot(x - CX, y - CY), rr = rhoAt(x, y), s = r / rr;
  if (s <= 1) { const q = 1 - s * s; return half.Hr + half.D * q * q; }
  const u = Math.min(1, (r - rr) / RIM); return half.Hr * Math.sqrt(Math.max(0, 1 - u * u));
}

// ================= pockets carved into the shell (wells, screen surround, speaker slots) =================
const sdRBox = (px, py, cx, cy, hx, hy, r) => {
  px -= cx; py -= cy;
  const rr = typeof r === 'number' ? r : (px > 0 ? (py > 0 ? r[0] : r[1]) : (py > 0 ? r[2] : r[3]));
  const qx = Math.abs(px) - hx + rr, qy = Math.abs(py) - hy + rr;
  return Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - rr;
};
const sdEll = (px, py, cx, cy, rx, ry) => (Math.hypot((px - cx) / rx, (py - cy) / ry) - 1) * Math.min(rx, ry);
const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
const smax0 = (x, r) => x >= r ? x : x <= -r ? 0 : (x + r) * (x + r) / (4 * r);

// layout, measured off the shipped index.html (shell units)
const L = {
  bezel: { cx: 0, cy: SY(177.6), hx: 115, hy: 92, r: [12, 20, 12, 20] },
  lcd: { cx: 0, cy: SY(175.6), w: 198, h: 160 },
  caps: [
    { key: 'left', x: SX(99), y: SY(339.6), r: 26, well: [32, 33], wy: SY(340.6), color: P.look, ink: P.lookInk, label: '<', size: 13 },
    { key: 'pet', x: 0, y: SY(341.6), r: 28, well: [34, 35], wy: SY(342.6), color: P.pet, ink: P.petInk, label: 'PET', size: 9 },
    { key: 'right', x: SX(259), y: SY(339.6), r: 26, well: [32, 33], wy: SY(340.6), color: P.look, ink: P.lookInk, label: '>', size: 13 },
  ],
  power: { x: SX(326), y: SY(226), hx: 22, hy: 14.5, key: [36, 19] },
  slots: [82, 78, 72, 64].map((w, k) => ({ x1: SX(174.7), w, y: SY(394.6 + 9 * k) })),
  plate: { x: SX(233), y: SY(402.9), w: 64.6, h: 20.6 },
  screws: [[44.8, 141], [313.2, 141], [49.9, 359], [308.1, 359], [179, 434]].map(([x, y]) => [SX(x), SY(y)]),
};

const POCKETS = [], BACK_POCKETS = [];
// a pocket's floor is level (o.depth below the surface at its centre), unless `rel`: then it follows the
// curve of the shell at that depth, which is what a long thin seam over a domed surface needs
function addPocket(list, half, sd, cx, cy, o) {
  const top = surfH(cx, cy, half), floor = o.floor != null ? o.floor : top - o.depth, depth = o.rel ? o.depth : top - floor;
  list.push({ sd, floor, depth, rel: !!o.rel, slope: o.slope, fil: o.fil, lip: o.lip, ao: o.ao || 0, dark: o.dark || 0, reach: depth / o.slope + o.lip + 2 });
  return floor;
}
// the screen surround sits in its pocket a hair below the lowest point of the shell around it
let edgeMin = 1e9;
for (let k = 0; k < 720; k++) {
  const a = (k / 720) * Math.PI * 2, b = L.bezel;
  // walk the rounded rectangle's outline by marching out from its centre
  let lo = 0, hi = 200; const dx = Math.cos(a), dy = Math.sin(a);
  for (let it = 0; it < 30; it++) { const m = (lo + hi) / 2; (sdRBox(b.cx + dx * m, b.cy + dy * m, b.cx, b.cy, b.hx, b.hy, b.r) < 0 ? lo = m : hi = m); }
  edgeMin = Math.min(edgeMin, surfH(b.cx + dx * lo, b.cy + dy * lo, FRONT));
}
const BEZEL_T = 6.4, INSERT_TOP = edgeMin - 1.4;
const BEZEL_FLOOR = addPocket(POCKETS, FRONT, (x, y) => sdRBox(x, y, L.bezel.cx, L.bezel.cy, L.bezel.hx, L.bezel.hy, L.bezel.r), L.bezel.cx, L.bezel.cy,
  { floor: INSERT_TOP - BEZEL_T - 0.1, slope: 4, fil: 0.8, lip: 1.6 });
const WELL_FLOOR = L.caps.map(c => addPocket(POCKETS, FRONT, (x, y) => sdEll(x, y, c.x, c.wy, c.well[0], c.well[1]), c.x, c.wy, { depth: 6, slope: 2.4, fil: 1.6, lip: 2.2, ao: 0.55 }));
const POWER_FLOOR = addPocket(POCKETS, FRONT, (x, y) => sdRBox(x, y, L.power.x, L.power.y, L.power.hx, L.power.hy, 7), L.power.x, L.power.y, { depth: 5, slope: 2.6, fil: 1.2, lip: 1.8, ao: 0.5 });
for (const s of L.slots) addPocket(POCKETS, FRONT, (x, y) => sdRBox(x, y, s.x1 - s.w / 2, s.y, s.w / 2, 2, 2), s.x1 - s.w / 2, s.y, { depth: 4.5, slope: 5, fil: 0.5, lip: 0.9, ao: 0.85, dark: 0.55 });
// back: a counterbore for each screw that holds the halves together
for (const [x, y] of L.screws) addPocket(BACK_POCKETS, BACK, (px, py) => sdEll(px, py, x, y, 7, 7), x, y, { depth: 3.2, slope: 3, fil: 0.8, lip: 1.2, ao: 0.6 });
// the battery door, right over her coin cell (which sits mirrored across from the power key): a seam all
// round it and one small screw at its inner end, like her Tamagotchi ancestors
const DOOR = { cx: SX(46), cy: SY(226), hx: 32, hy: 36, r: 7, screw: [SX(69), SY(226)] };
addPocket(BACK_POCKETS, BACK, (px, py) => Math.abs(sdRBox(px, py, DOOR.cx, DOOR.cy, DOOR.hx, DOOR.hy, DOOR.r)) - 0.9, DOOR.cx, DOOR.cy,
  { rel: true, depth: 1.5, slope: 2.2, fil: 0.5, lip: 0.5, ao: 0.55, dark: 0.3 });
addPocket(BACK_POCKETS, BACK, (px, py) => sdEll(px, py, DOOR.screw[0], DOOR.screw[1], 5, 5), DOOR.screw[0], DOOR.screw[1], { depth: 2.4, slope: 3, fil: 0.6, lip: 0.8, ao: 0.55 });

function carve(list, x, y, z0) {
  let z = z0, occl = 0, dark = 1;
  for (const p of list) {
    const sd = p.sd(x, y);
    if (sd > p.reach) continue;
    const zn = smin(z, (p.rel ? z0 - p.depth : p.floor) + smax0(p.slope * sd + p.depth, p.fil), p.lip);
    if (zn < z) {
      const dz = z0 - zn;
      occl = Math.max(occl, (dz / (dz + Math.max(0, -sd) * 0.9 + 1.5)) * p.ao);
      if (p.dark && sd < 0) dark = Math.min(dark, 1 - p.dark * Math.min(1, -sd / 1.2));
      z = zn;
    }
  }
  return [z, (1 - occl) * dark];
}

// ---- the slide's groove on the top-right shoulder: stops at 67/58/49/40 degrees round the top arc ----
const SLIDE_STOPS = [67, 58, 49, 40];
const G_D = 5, G_HW = 3.5, G_DEPTH = 3, G_B0 = Math.acos(1 - G_D / RIM);
const arcAtAngle = (deg) => {
  const a = deg * Math.PI / 180, x = SX(179 + 179 * Math.cos(a)), y = SY(258 - 258 * Math.sin(a));
  let best = 0, bd = 1e9; O.forEach((p, i) => { const d = Math.hypot(p[0] - x, p[1] - y); if (d < bd) { bd = d; best = i; } });
  return SARC[best];
};
const G_S0 = arcAtAngle(SLIDE_STOPS[3] - 4), G_S1 = arcAtAngle(SLIDE_STOPS[0] + 4);
function grooveAt(i, beta) {
  const s = SARC[i], along = s < G_S0 ? G_S0 - s : s > G_S1 ? s - G_S1 : 0;
  if (along > G_HW) return 0;
  const dq = RIM * (1 - Math.cos(beta)) - G_D, dz = FRONT.Hr * (Math.sin(beta) - Math.sin(G_B0));
  const dist = Math.hypot(dq, dz, along);
  return dist >= G_HW ? 0 : 1 - smoothstep(0.5, 1, dist / G_HW);
}
// a point on the groove's centre line, with the surface normal and the tangent there
function slideFrame(deg, lift = 0) {
  const a = deg * Math.PI / 180, ox = SX(179 + 179 * Math.cos(a)), oy = SY(258 - 258 * Math.sin(a));
  let nx = (ox - CX) / (179 * 179), ny = (oy - CY) / (258 * 258); const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
  const cb = Math.cos(G_B0), sb = Math.sin(G_B0);
  const n = new THREE.Vector3(nx * FRONT.Hr * cb, ny * FRONT.Hr * cb, RIM * sb).normalize();
  const p = new THREE.Vector3(ox - G_D * nx, oy - G_D * ny, FRONT.Hr * sb).addScaledVector(n, lift);
  return { p, n, t: new THREE.Vector3(-ny, nx, 0) };
}

// ================= build one half of the shell =================
function buildHalf(front) {
  const half = front ? FRONT : BACK, JFh = front ? JF : JFB, sgn = front ? 1 : -1;
  const rings = JR + JFh, nv = rings * NT + 1;
  const pos = new Float32Array(nv * 3), uv = new Float32Array(nv * 2), col = new Float32Array(nv * 3);
  let v = 0;
  const put = (x, y, z, c) => {
    pos[v * 3] = x; pos[v * 3 + 1] = y; pos[v * 3 + 2] = z * sgn;
    uv[v * 2] = (x + 179) / 358; uv[v * 2 + 1] = (y + 226) / 452;
    col[v * 3] = col[v * 3 + 1] = col[v * 3 + 2] = c; v++;
  };
  const list = front ? POCKETS : BACK_POCKETS;
  for (let j = 0; j <= JR; j++) {
    const beta = (j / JR) * Math.PI / 2, cb = Math.cos(beta), sb = Math.sin(beta);
    const seam = 1 - smoothstep(0, 0.1, beta); // the parting line where the two halves meet
    const d = RIM * (1 - cb) + 0.9 * seam;
    for (let i = 0; i < NT; i++) {
      let x = O[i][0] - d * N[i][0], y = O[i][1] - d * N[i][1], z = half.Hr * sb, c = 1 - 0.45 * seam;
      if (front) {
        const g = grooveAt(i, beta);
        if (g > 0) {
          const nx = N[i][0] * half.Hr * cb, ny = N[i][1] * half.Hr * cb, nz = RIM * sb, l = Math.hypot(nx, ny, nz);
          x -= (nx / l) * G_DEPTH * g; y -= (ny / l) * G_DEPTH * g; z -= (nz / l) * G_DEPTH * g; c *= 1 - 0.82 * g;
        }
      }
      if (sb > 0.5) { const r = carve(list, x, y, z); z = r[0]; c *= r[1]; }
      put(x, y, z, c);
    }
  }
  for (let k = 1; k < JFh; k++) {
    const s = 1 - k / JFh, q = 1 - s * s, zf = half.Hr + half.D * q * q;
    for (let i = 0; i < NT; i++) {
      const x = CX + (OR[i][0] - CX) * s, y = CY + (OR[i][1] - CY) * s, r = carve(list, x, y, zf);
      put(x, y, r[0], r[1]);
    }
  }
  { const r = carve(list, CX, CY, half.Hr + half.D); put(CX, CY, r[0], r[1]); }
  const idx = new Uint32Array((rings - 1) * NT * 6 + NT * 3);
  let t = 0;
  for (let r = 0; r < rings - 1; r++) for (let i = 0; i < NT; i++) {
    const a = r * NT + i, b = r * NT + (i + 1) % NT, c = (r + 1) * NT + i, d = (r + 1) * NT + (i + 1) % NT;
    if (front) { idx[t++] = a; idx[t++] = b; idx[t++] = d; idx[t++] = a; idx[t++] = d; idx[t++] = c; }
    else { idx[t++] = a; idx[t++] = d; idx[t++] = b; idx[t++] = a; idx[t++] = c; idx[t++] = d; }
  }
  const ctr = rings * NT, last = (rings - 1) * NT;
  for (let i = 0; i < NT; i++) { const a = last + i, b = last + (i + 1) % NT; if (front) { idx[t++] = a; idx[t++] = b; idx[t++] = ctr; } else { idx[t++] = a; idx[t++] = ctr; idx[t++] = b; } }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  return g;
}

// ================= renderer, studio, camera =================
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
// sharp enough on a retina screen at 1.5; past that the extra pixels cost more than they show
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// she is drawn again only when something changed, so a still frame costs nothing. Shadows are redrawn only when
// something that casts one moved (her parts, or the studio light, which turns with the view)
renderer.shadowMap.autoUpdate = false;
let dirty = true, shadowsDirty = true;
const invalidate = (shadows) => { dirty = true; if (shadows) shadowsDirty = true; };
const canvasTex = (c, srgb = true) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };

function rrPath(p, cx, cy, w, h, tl, tr, br, bl) {
  const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2;
  p.moveTo(x0 + bl, y0); p.lineTo(x1 - br, y0); p.absarc(x1 - br, y0 + br, br, -Math.PI / 2, 0, false);
  p.lineTo(x1, y1 - tr); p.absarc(x1 - tr, y1 - tr, tr, 0, Math.PI / 2, false);
  p.lineTo(x0 + tl, y1); p.absarc(x0 + tl, y1 - tl, tl, Math.PI / 2, Math.PI, false);
  p.lineTo(x0, y0 + bl); p.absarc(x0 + bl, y0 + bl, bl, Math.PI, Math.PI * 1.5, false);
  return p;
}

function projectUV(g, w, h) {
  const p = g.attributes.position, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) { uv[i * 2] = p.getX(i) / w + 0.5; uv[i * 2 + 1] = p.getY(i) / h + 0.5; }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return g;
}
function capGeometry(r, h, dome = 1.3, edge = 3.2) {
  const pts = [new THREE.Vector2(0.001, 0), new THREE.Vector2(r - 0.8, 0), new THREE.Vector2(r, 0.8), new THREE.Vector2(r, h - edge - dome)];
  for (let k = 1; k <= 10; k++) { const a = (k / 10) * Math.PI / 2; pts.push(new THREE.Vector2(r - edge + edge * Math.cos(a), h - dome - edge + edge * Math.sin(a))); }
  for (let k = 1; k <= 12; k++) { const rr = (r - edge) * (1 - k / 12); pts.push(new THREE.Vector2(Math.max(rr, 0.001), h - dome * (rr * rr) / ((r - edge) * (r - edge)))); }

  return projectUV(g, r * 2, r * 2);
}

  if (t > nextMicro && hopStart == null && t > microUntil && !mood && !asleep) {
    if (Math.random() < 0.35) { micro = 'tap'; microUntil = t + 780; } else { micro = 'look'; microDir = Math.random() < 0.5 ? -1 : 1; microUntil = t + 950; }
    nextMicro = t + 4600 + Math.random() * 4200;
  }
  let hopPx = 0, happy = false, mouthOpen = false;
  if (hopStart != null) { const p = (t - hopStart) / 560; if (p >= 1) hopStart = null; else { hopPx = -Math.sin(p * Math.PI) * 30; happy = true; mouthOpen = true; } }
  const breath = asleep ? Math.sin((t - sleptAt) / 1100 * 0.32) : Math.sin(t / 1100);
  const oyPx = OY + Math.round(breath * (asleep ? 3 : 2)) + hopPx;
  const active = t < microUntil ? micro : null, sinceWake = t - wokeAt;
  const blink = t < blinkUntil || (sinceWake > 0 && sinceWake < 180) || (sinceWake > 420 && sinceWake < 560);
  const lookDir = active === 'look' ? microDir : 0, tap = active === 'tap';

  sig = 2166136261;
  sctx.setTransform(SS, 0, 0, SS, 0, 0);
  sctx.imageSmoothingEnabled = false;
  px(0, 0, CW, CH, C.bg);
  if (!asleep) meter(t);
  px(OX + 2 * ART, OY + 12 * ART + 4, 10 * ART, 5, C.tdark, 0.22);
  const bulb = mood || asleep ? BULB_DIM[breath > 0 ? 1 : 0] : breath > 0 ? C.peribright : C.peri;
  for (let r = 0; r < BODY.length; r++) for (let ci = 0; ci < BODY[r].length; ci++) { const col = SHADED[r][ci]; if (col) cell(ci, r, oyPx, col === 'bulb' ? bulb : col); }
  const drawEye = (b, side) => {
    if (asleep) { const peek = side < 0 && t < peekUntil; cell(b, 5, oyPx, LID); cell(b + 1, 5, oyPx, LID); cell(b, 6, oyPx, peek ? C.bg : CREASE); cell(b + 1, 6, oyPx, peek ? C.bg : CREASE); }
    else if (happy) { cell(b, 6, oyPx, C.bg); cell(b + 1, 5, oyPx, C.bg); cell(b + 2, 6, oyPx, C.bg); }
    else if (mood === 'snub') { const c = b + snubSide; cell(c, 5, oyPx, LID); cell(c + 1, 5, oyPx, LID); const e = blink ? LID : C.bg; cell(c, 6, oyPx, e); cell(c + 1, 6, oyPx, e); }
    else if (blink) { cell(b, 6, oyPx, C.bg); cell(b + 1, 6, oyPx, C.bg); }
    else if (mood === 'sulk') { const inner = side < 0 ? b + 1 : b; cell(inner + lookDir, 5, oyPx, C.bg); cell(b + lookDir, 6, oyPx, C.bg); cell(b + 1 + lookDir, 6, oyPx, C.bg); }
    else { cell(b + lookDir, 5, oyPx, C.bg); cell(b + 1 + lookDir, 5, oyPx, C.bg); cell(b + lookDir, 6, oyPx, C.bg); cell(b + 1 + lookDir, 6, oyPx, C.bg); }
  };
  drawEye(3, -1); drawEye(9, 1);
  if (mood === 'snub') cell(snubSide > 0 ? 8 : 5, 8, oyPx, C.bg);
  else if (mood === 'sulk') { cell(6, 8, oyPx, C.bg); cell(7, 8, oyPx, C.bg); cell(5, 9, oyPx, C.bg); cell(8, 9, oyPx, C.bg); cell(3, 7, oyPx, TEAR); }
  else { cell(6, 8, oyPx, C.bg); cell(7, 8, oyPx, C.bg); if (mouthOpen) { cell(6, 9, oyPx, C.bg); cell(7, 9, oyPx, C.bg); } }
  if (tap) { cell(13, 6, oyPx, C.peri); cell(14, 6, oyPx, C.peribright); }
  if (asleep) {
    const since = t - sleptAt - 900;
    for (let k = 0; k < 3; k++) {
      const p = (since / 3400 - k / 3) % 1; if (since < 0 || p < 0) continue;
      const a = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85, zc = p > 0.45 ? 5 : 4, zx = OX + 12 * ART + Math.round(p * 14), zy = oyPx + 16 - Math.round(p * 52);
      for (let r = 0; r < Z.length; r++) for (let ci = 0; ci < Z[r].length; ci++) if (Z[r][ci] === '#') px(zx + ci * zc, zy + r * zc, zc, zc, C.tlight, a * 0.9);
    }
  }
  hearts = hearts.filter(h => t - h.born < 1250);
  for (const h of hearts) {
    const p = (t - h.born) / 1250, hy = (OY - 6) + hopPx * 0.3 - p * 58, a = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85;
    for (let r = 0; r < HEART.length; r++) for (let ci = 0; ci < HEART[r].length; ci++) if (HEART[r][ci] !== ' ') px(h.x + ci * ART, hy + r * ART, ART, ART, C.heart, Math.max(0, a));
  }
  // the thank-you message after a pet
  msgA += ((t < msgUntil ? 1 : 0) - msgA) * Math.min(1, dt / 120);
  if (msgA > 0.01) {
    mix(Math.round(msgA * 32));
    sctx.globalAlpha = msgA;
    px(0, 0, CW, CH, 'rgba(5,8,16,0.74)');
    sctx.globalAlpha = msgA; sctx.font = `13px ${PS}`; sctx.letterSpacing = '2px'; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.shadowColor = 'rgba(89,175,177,0.4)'; sctx.shadowBlur = 8 * SS; sctx.fillStyle = C.teal;
    sctx.fillText('THX FOR', CW / 2 + 1, CH / 2 - 20); sctx.fillText('VISITING!', CW / 2 + 1, CH / 2 + 4);
    sctx.shadowBlur = 0; sctx.fillStyle = C.heart; sctx.fillRect(CW / 2 - 52, CH / 2 + 22, 104, 3);
    sctx.globalAlpha = 1; sctx.textAlign = 'left';

  edge(0, 0, 0, 14, 0.75); sctx.fillRect(0, 0, CW, 14);
  edge(0, CH, 0, CH - 10, 0.55); sctx.fillRect(0, CH - 10, CW, 10);
  edge(0, 0, 10, 0, 0.6); sctx.fillRect(0, 0, 10, CH);
  edge(CW, 0, CW - 10, 0, 0.6); sctx.fillRect(CW - 10, 0, 10, CH);

}

// ================= sound (cuelume, her picks) and mute on the speaker =================
let cue = null;
import('https://esm.sh/cuelume@0.2.2').then(m => { cue = m; }).catch(() => {});
let muted = false;
try { muted = localStorage.getItem('peri-muted') === '1'; } catch (e) {}
const sound = (name) => { if (muted || !cue) return; try { cue.play(name, { volume: 0.6 }); } catch (e) {} };
function setMuted(m) {
  muted = m; try { localStorage.setItem('peri-muted', m ? '1' : '0'); } catch (e) {}
  if (!m) sound('bloom');
}

// ================= presses =================
function press(obj) { obj.userData.pressT = performance.now(); }
function act(k) {
  if (k === 'pet') {
    press(caps.pet);
    pulse('pet', () => {
      const t = performance.now();
      if (asleep) { peekUntil = t + 900; return; }
      levelAtPet = Math.max(0, 1 - lonely / SULK_AFTER) * 5; refillAt = t; lonely = 0;
      sound('success');
      if (!muted) pulse('spkOut', thump); // her sound runs back down to the speaker
      if (hopStart == null) { hopStart = t; hearts.push({ born: t, x: OX + 3.5 * ART }); }
      msgUntil = t + 2600;
    });
  } else if (k === 'left' || k === 'right') {
    press(caps[k]);
    pulse(k, () => {
      if (asleep) return;
      sound('press');
      const dir = k === 'left' ? -1 : 1; snubSide = dir; micro = 'look'; microDir = dir; microUntil = performance.now() + 850;
    });
  } else if (k === 'power') {
    press(powerKey);
    pulse('power', () => {
      const t = performance.now();
      sound('toggle'); if (!muted) thump();
      asleep = !asleep;
      if (asleep) { sleptAt = t; hopStart = null; hearts = []; micro = null; msgUntil = 0; }
      else { wokeAt = t; lonely = 0; nextMicro = t + 3800; }
      drawPowerLabel(asleep);
      hintText = asleep ? 'shh… tap ON to wake her' : 'tap to say hi to Peri';
      redrawPrint();
    });
  } else if (k === 'grille') {
    setMuted(!muted);
    if (!muted) thump();
  }
}
function pickStop(point) {
  const local = peri.worldToLocal(point.clone());
  const a = Math.atan2((local.y - CY) / 258, local.x / 179) * 180 / Math.PI;
  let best = 0; SLIDE_STOPS.forEach((s, i) => { if (Math.abs(s - a) < Math.abs(SLIDE_STOPS[best] - a)) best = i; });
  if (MATS[best] !== opts.mat) { const n = Math.abs(best - MATS.indexOf(opts.mat)); for (let k = 0; k < n; k++) setTimeout(() => sound('tick'), k * 70); setMat(MATS[best]); }
}

// pointer: a click is a press without a drag; dragging turns her
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const hit = (e) => { const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.intersectObjects(clickables, false)[0]; };
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; camAnim = null; });
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 5) return;
  const h = hit(e); if (!h) return;
  const k = h.object.userData.key;
  if (k === 'slide') pickStop(h.point); else act(k);
});
canvas.addEventListener('pointermove', (e) => { if (e.buttons) return; canvas.style.cursor = hit(e) ? 'pointer' : 'grab'; });
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('button')) return;
  const k = { ArrowLeft: 'left', ArrowRight: 'right', p: 'pet', P: 'pet', o: 'power', O: 'power', m: 'grille', M: 'grille' }[e.key];
  if (k) { e.preventDefault(); act(k); }
});

// ================= toggles =================
document.querySelectorAll('.bar button').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.k, v = b.dataset.v;
  if (k === 'mat') { if (v !== opts.mat) { sound('tick'); setMat(v); } return; }
  opts[k] = v; saveOpts(); syncBar();
  if (k === 'view') goView(v);
  if (k === 'tone') { setTone(); invalidate(); }
}));
// turning her by hand (and its glide to a stop) moves the camera, and with it the studio light
controls.addEventListener('change', () => invalidate(true));

// ================= go =================
setTone();
setMat(opts.mat, true);
goView(opts.view, true);
syncBar();
$('status').remove();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); bloom.resolution.set(innerWidth, innerHeight);
  drawBackdrop(); invalidate(true);
});
// debugging: the rendered color at a point on the page (css px)
window.__probe = (x, y) => { invalidate(true); step(performance.now()); const gl = renderer.getContext(), d = new Uint8Array(4), k = renderer.getPixelRatio(); gl.readPixels(Math.round(x * k), Math.round((innerHeight - y) * k), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, d); return '#' + [...d.slice(0, 3)].map(v => v.toString(16).padStart(2, '0')).join(''); };

const ease = (x) => 1 - Math.pow(1 - x, 3);
const pressCurve = (ms) => ms < 0 ? 0 : ms < 50 ? ms / 50 : ms < 130 ? 1 : ms < 260 ? 1 - ease((ms - 130) / 130) : 0;
let last = performance.now(), ledKey = '';
// her clock runs every frame (she keeps blinking, missing you, falling asleep); the GPU only works when that,
// or anything else, changed what you'd see
function step(t) {
  const dt = Math.min(t - last, 100); last = t;
  const { breath, mood } = drawScreen(t, dt);
  const see = cur.transmission > 0.002;
  if (inside.visible !== see) { inside.visible = see; invalidate(true); }
  if (see) {
    if (drawPulses(t)) invalidate();
    // the LED breathes with her bulb, dims with it in a mood, and goes out while she sleeps. Its glow is
    // stepped in 1/40ths, finer than the eye follows, so a breath is ~24 redraws, not one every frame
    const col = asleep ? '#32428D' : mood ? BULB_DIM[0] : breath > 0 ? C.peribright : C.peri;
    const k = Math.round((asleep ? 0.1 : mood ? 0.7 : 1.1 + 0.6 * (breath * 0.5 + 0.5)) * 40) / 40;
    if (col + k !== ledKey) {
      ledKey = col + k;
      ledMat.emissive.set(col); ledMat.emissiveIntensity = k;
      ledLight.color.set(col); ledLight.intensity = asleep ? 0 : k * 260;
      invalidate();
    }
    // the cone's thump, v2's 1 → .93 → 1.02 → 1 in 260ms: seen from the front, depth alone barely shows,
    // so the cone also pulls in across its face
    const th = t - thumpT;
    const s = th < 260 ? (th < 87 ? 1 - 0.07 * th / 87 : th < 173 ? 0.93 + 0.09 * (th - 87) / 86 : 1.02 - 0.02 * (th - 173) / 87) : 1;
    if (speakerCone.scale.x !== s) { speakerCone.scale.set(s, s, 1 - (1 - s) * 4); invalidate(true); }
  }

  if (matT0 > 0) {
    const f = Math.min(1, (t - matT0) / 450), e = f * f * (3 - 2 * f);
    for (const k in matTo) cur[k] = matFrom[k] + (matTo[k] - matFrom[k]) * e;
    applyMat(cur);
    if (f === 1 || Math.round(f * 12) !== Math.round(((t - dt) - matT0) / 450 * 12)) redrawPrint();
    if (f === 1) matT0 = -1e9;
    invalidate(true);
  }
  // the knob glides to its stop
  if (Math.abs(knobDeg - knobTarget) > 0.01) { knobDeg += (knobTarget - knobDeg) * Math.min(1, dt / 70); placeKnob(knobDeg); invalidate(true); }
  for (const o of [caps.left, caps.pet, caps.right, powerKey]) {
    const z = o.userData.z0 - o.userData.travel * pressCurve(t - o.userData.pressT);
    if (o.position.z !== z) { o.position.z = z; invalidate(true); }
  }
  if (camAnim) {
    const f = Math.min(1, (t - camAnim.t0) / 900), e = 1 - Math.pow(1 - f, 3);
    placeCamera(camAnim.a0 + camAnim.da * e, camAnim.e0 + camAnim.de * e, camAnim.d0 + camAnim.dd * e);
    if (f === 1) camAnim = null;
    invalidate(true);
  }
  controls.update();
  if (!dirty) return;
  // the studio turns with the view, as if she spun on a turntable under fixed lights: the key always comes
  // from the top left of whoever is looking at her
  const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  key.position.set(KEY_POS.x * Math.cos(az) + KEY_POS.z * Math.sin(az), KEY_POS.y, -KEY_POS.x * Math.sin(az) + KEY_POS.z * Math.cos(az));
  scene.environmentRotation.set(0, az, 0);

  composer.render();

  renders++;
}
let renders = 0;
function frame(t) {
  step(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__peri = { scene, camera, renderer, act, setMat, goView, controls, pulse, pulseCanvas, composer, bloom, key, screenTex, frontMesh, backMesh, inside, step, get renders() { return renders; } };
